# ============================================================
# Pure VL (Vision-Language) RL training config
# No Monet/latent model required — works with any standard
# Qwen2.5-VL (or compatible) checkpoint.
# ============================================================

data:
  train_files: path/to/your/train_dataset        # parquet dir, HF dataset id, or "hf_id@split"
  val_files:   path/to/your/val_dataset
  prompt_key: problem       # column containing the question text
  answer_key: answer        # column containing the ground-truth answer
  image_key:  images        # column containing images (list of PIL / base64 strings)
  max_prompt_length: 4096
  max_response_length: 4096
  val_batch_size: 512
  format_prompt: ./examples/format_prompt/monet_format.jinja  # reuse existing jinja template
  override_chat_template: null
  shuffle: true
  seed: 1
  max_pixels: 3136000   # 2000 * 1568
  min_pixels: 262144    # 512 * 512
  # Set to false when using a custom / generic dataset that is not in the
  # hard-coded dataset_name_from_path allow-list.
  filter_overlong_and_invalid_prompts: false
  train_max_samples: -1   # -1 = all; use 128 for quick debugging
  val_max_samples:   -1   # -1 = all; use  32 for quick debugging

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2

worker:
  actor:
    global_batch_size: 64
    micro_batch_size_per_device_for_update: 2
    micro_batch_size_per_device_for_experience: 8
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    model:
      model_path: ""          # set via CLI: worker.actor.model.model_path=...
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true

  rollout:
    n: 8                        # number of responses sampled per prompt
    temperature: 1.0
    top_p: 0.99
    max_num_seqs: 256
    gpu_memory_utilization: 0.85
    enforce_eager: true
    enable_chunked_prefill: true
    tensor_parallel_size: 1
    limit_images: 4             # must be >= 1 for multimodal inputs
    # "greedy" uses the standard generate_sequences path — no Monet hash server needed
    sampling_strategy: greedy
    repetition_penalty: 1.0
    val_override_config:
      temperature: 0.1
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_type: batch
    # Pure VL reward: no latent tokens, no length-penalty from hash server
    reward_function: ./examples/reward_function/vl_reward_function.py:compute_score

  rule_based_judge:
    judge_type: single
    judge_function: ./examples/reward_function/vl_reward_function.py:rule_then_api_batch_judge
    api_name: gemini-2.5-pro
    api_kwargs:
      temperature: 0.1

trainer:
  total_epochs: 1
  max_steps: null
  project_name: vl_rl
  experiment_name: qwen2_5_vl_grpo
  logger: ["console", "wandb"]
  nnodes: 1
  n_gpus_per_node: 8
  val_freq: 5       # validate every N update steps; -1 to disable
  val_before_train: true
  val_only: false
  val_generations_to_log: 5
  save_freq: 10
  save_limit: 5
  save_checkpoint_path: null
  load_checkpoint_path: null
